name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    # release-please PRs only touch these; skipping them avoids a race where
    # auto-merge deletes the head and CI fails with "workflow file issue".
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'version.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--master'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  ci:
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--master'
    name: PHP ${{ matrix.php }} / Moodle ${{ matrix.moodle-branch }} / ${{ matrix.database }}
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 5432:5432

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 3306:3306

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', moodle-branch: 'MOODLE_405_STABLE', database: 'pgsql' }
          - { php: '8.3', moodle-branch: 'MOODLE_405_STABLE', database: 'mariadb' }
          - { php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: 'pgsql' }
          - { php: '8.4', moodle-branch: 'MOODLE_502_STABLE', database: 'mariadb' }

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, pgsql, mysqli, gd, curl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # codechecker / phpdoc: 472 avisos actuales (casi todos snake_case).
      # Se añaden cuando el plugin pase Moodle CS.

      - name: PHPUnit tests
        if: ${{ !cancelled() && hashFiles('plugin/tests/**') != '' }}
        run: moodle-plugin-ci phpunit --fail-on-warning
